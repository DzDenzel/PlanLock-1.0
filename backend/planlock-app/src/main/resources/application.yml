server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: planlock-backend
  datasource:
    url: jdbc:mysql://localhost:3306/planlock?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${PLANLOCK_DB_USER:root}
    password: ${PLANLOCK_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${PLANLOCK_REDIS_HOST:localhost}
      port: ${PLANLOCK_REDIS_PORT:6379}
      password: ${PLANLOCK_REDIS_PASSWORD:root}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.planlock

planlock:
  jwt:
    secret: ${PLANLOCK_JWT_SECRET:planlock-dev-secret-key-change-me-0123456789}
    expire-minutes: ${PLANLOCK_JWT_EXPIRE_MINUTES:10080}

logging:
  level:
    com.planlock: debug
